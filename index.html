<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sudoku (Brain Fitness)</title>
<style>
  :root {
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
    background: linear-gradient(135deg, #8040bf 0%, #296bd9 100%);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    color: #ffffff;
  }
  .card {
    max-width: 440px;
    width: 100%;
    text-align: center;
  }
  h1 {
    font-size: clamp(32px, 7vw, 44px);
    margin: 0 0 4px;
    font-weight: 700;
  }
  .subtitle {
    color: #f6a623;
    font-weight: 700;
    letter-spacing: 0.12em;
    font-size: 15px;
    margin: 0 0 24px;
  }
  p {
    line-height: 1.55;
    font-size: 17px;
    color: #f0edfb;
    margin: 0 0 28px;
  }
  .btn {
    display: inline-block;
    background: #ffffff;
    color: #4c2d8f;
    font-weight: 700;
    font-size: 16px;
    text-decoration: none;
    padding: 14px 32px;
    border-radius: 999px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.18);
  }
  .btn:active { transform: translateY(1px); }
  footer {
    margin-top: 40px;
    font-size: 13px;
    color: #d9d2f2;
  }
  footer a { color: #d9d2f2; }
</style>
</head>
<body>
  <div class="card">
    <h1>Sudoku</h1>
    <p class="subtitle">BRAIN FITNESS</p>
    <p>Big, easy-to-read numbers. No sign-up. Play through five difficulty levels at your own pace.</p>
    <a class="btn" href="https://play.google.com/store/apps/details?id=com.lazygame.sudoku_free">Get it on Google Play</a>
    <footer>
      <a href="https://claude.ai/code/artifact/c47cb7bf-ea46-4ede-bec8-ba6c1558f201">Privacy Policy</a>
    </footer>
  </div>
</body>
</html>
